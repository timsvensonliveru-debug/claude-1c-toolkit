# Копия: config/servicedesk.toml (в git не попадает). Имена шаблонов и групп берём из конфига:
# обычный ключ API часто не читает списки шаблонов и групп (403, 404).
# Псевдонимы пишите латиницей или в кавычках ("Псевдоним" = "..."): голые ключи TOML бывают только латинские.
[templates]
access_request = "Точное имя шаблона заявки в ServiceDesk Plus"

[groups]
support = "Точное имя группы"

# Значение шаблона: строка это имя, целое число это id шаблона.
# [templates]
# internal_work = 700
#
# Имя техника пишется полностью, как в портале (проверка: servicedesk.py meta --what technicians).
# [technicians]
# main = "Фамилия Имя Отчество"
#
# Назначение и приоритет по умолчанию, перекрываются --technician и --priority.
# [defaults]
# technician = "main"
# priority = "Низкий"
